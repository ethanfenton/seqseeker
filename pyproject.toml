[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "seqseeker"
version = "0.1.1"
description = "Fast k-mer–based detection of any target sequence in paired single-cell FASTQ files"
readme = "README.md"
license = { text = "MIT" }
authors = [
    { name = "Ethan Fenton", email = "ethanfenton27@gmail.com" },
]
keywords = [
    "bioinformatics", "single-cell", "RNA-seq", "FASTQ", "fluorescent protein",
    "GFP", "barcode", "10x Genomics",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
]
requires-python = ">=3.10"
dependencies = []   # zero runtime dependencies — pure stdlib + compiled C

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.urls]
Homepage    = "https://github.com/ethanfenton/seqseeker"
Repository  = "https://github.com/ethanfenton/seqseeker"
"Bug Tracker" = "https://github.com/ethanfenton/seqseeker/issues"

[project.scripts]
seqseeker = "seqseeker._cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
seqseeker = ["_c_src/*.c"]

# ── Developer tooling ─────────────────────────────────────────────────────────

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts   = "-v"

[tool.ruff]
line-length = 100
target-version = "py310"
